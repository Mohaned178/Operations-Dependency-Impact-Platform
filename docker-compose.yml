services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsgraph
      POSTGRES_PASSWORD: opsgraph
      POSTGRES_DB: opsgraph
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opsgraph']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
